title: ArchSpec
description: Architecture linter for Ruby and Rails.
url: https://archspecrb.dev
baseurl: ""
lang: en-US
timezone: UTC

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: pretty

theme: jekyll-vitepress-theme

collections:
  guides:
    output: true
    permalink: "/:name/"
  rules:
    output: true
    permalink: "/rules/:name/"
  architectures:
    output: true
    permalink: "/architectures/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      type: guides
    values:
      layout: default
  - scope:
      type: rules
    values:
      layout: default
  - scope:
      type: architectures
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /assets/images/archspec-social.png
      alt: "ArchSpec: executable architecture specifications for Ruby and Rails"
      width: 1200
      height: 630
    publisher:
      type: Organization
      name: ArchSpec
      url: https://archspecrb.dev
      same_as:
        - https://github.com/crmne/archspec
        - https://rubygems.org/gems/archspec
  llms:
    title: ArchSpec
    description: >-
      Documentation for ArchSpec, the static-analysis architecture linter for
      Ruby and Rails applications.
    full: true
    details: >-
      Start with getting started and configuration, then use the rule,
      architecture, CLI, CI, and AI-written-code guides. Source is on
      [GitHub](https://github.com/crmne/archspec), and the generated
      [API reference](https://archspecrb.dev/api/) documents the Ruby API.
  branding:
    site_title: ArchSpec
  tokens:
    light:
      "--vp-c-brand-1": "#7c3aed"
      "--vp-c-brand-2": "#9333ea"
      "--vp-c-brand-3": "#6d28d9"
      "--vp-c-brand-soft": "rgba(124, 58, 237, 0.14)"
      "--vp-home-hero-name-color": "transparent"
      "--vp-home-hero-name-background": "-webkit-linear-gradient(120deg, #7c3aed 30%, #06b6d4)"
      "--vp-home-hero-image-background-image": "linear-gradient(-45deg, #9333ea 50%, #06b6d4 50%)"
    dark:
      "--vp-c-brand-1": "#a78bfa"
      "--vp-c-brand-2": "#c4b5fd"
      "--vp-c-brand-3": "#8b5cf6"
      "--vp-c-brand-soft": "rgba(167, 139, 250, 0.16)"
      "--vp-home-hero-name-color": "transparent"
      "--vp-home-hero-name-background": "-webkit-linear-gradient(120deg, #a78bfa 30%, #22d3ee)"
      "--vp-home-hero-image-background-image": "linear-gradient(-45deg, #8b5cf6 50%, #22d3ee 50%)"
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      Brought to you by <a href="https://paolino.me" target="_blank" rel="noreferrer">Carmine Paolino</a>, maker of
    copyright: >-
      <span class="footer-brand-links"><a href="https://chatwithwork.com" class="footer-chatwithwork-link" target="_blank" rel="noreferrer"><img class="footer-chatwithwork-logo theme-image light" src="https://chatwithwork.com/logotype.svg" alt="Chat with Work"><img class="footer-chatwithwork-logo theme-image dark" src="https://chatwithwork.com/logotype-dark.svg" alt="Chat with Work"></a><a href="https://rubyllm.com" class="footer-rubyllm-link" target="_blank" rel="noreferrer"><img class="footer-rubyllm-logo theme-image light" src="https://rubyllm.com/assets/images/logotype.svg" alt="RubyLLM"><img class="footer-rubyllm-logo theme-image dark" src="https://rubyllm.com/assets/images/logotype_dark.svg" alt="RubyLLM"></a></span><br><span class="footer-built-with">Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>.</span>
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%-d %b %Y"
  edit_link:
    enabled: true
    pattern: "https://github.com/crmne/archspec/edit/master/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: crmne/archspec
    text: Star
    show_count: true
  labels:
    outline: On this page
    sidebar_menu: Menu
    return_to_top: Return to top
    skip_to_content: Skip to content
    appearance_menu: Appearance
    switch_to_dark: Switch to dark theme
    switch_to_light: Switch to light theme

plugins:
  - jekyll-vitepress-theme
