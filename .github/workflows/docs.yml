name: Docs

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - docs/**
      - .github/workflows/docs.yml
      # The API reference is generated from lib/ with the root bundle.
      - lib/**
      - .rdoc_options
      - Gemfile
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: crmne/jekyll-vitepress-theme/.github/workflows/publish-docs.yml@v1
    with:
      root-bundle: true
