name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Ruby ${{ matrix.ruby-version }}
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_DISABLE_SHARED_GEMS: "true"
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Check syntax
        run: find lib test -name "*.rb" -print0 | xargs -0 -n1 ruby -c && ruby -c exe/archspec

      - name: Run tests
        run: bundle exec rake test

      - name: Run architecture checks
        run: bundle exec rake architecture

      - name: Build gem
        run: gem build archspec.gemspec

  test_musl:
    name: Test Ruby 3.4 on Alpine (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test from the source gem on musl
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --env BUNDLE_PATH=/tmp/bundle \
            --env BUNDLE_DISABLE_SHARED_GEMS=true \
            --env BUNDLE_FORCE_RUBY_PLATFORM=true \
            --env RUSTFLAGS="-C target-feature=-crt-static" \
            ruby:3.4-alpine sh -elc '
              # Rubydex 0.4.4 needs a newer Rust than Alpine packages. Rustup
              # links musl statically by default, which stops bindgen loading
              # libclang, hence RUSTFLAGS above.
              apk add --no-cache build-base clang-dev git rustup
              rustup-init -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"
              bundle install
              find lib test -name "*.rb" -print0 | xargs -0 -n1 ruby -c
              ruby -c exe/archspec
              bundle exec rake test
              bundle exec rake architecture
              gem build archspec.gemspec
            '

  torture:
    name: Torture against Fizzy
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_DISABLE_SHARED_GEMS: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # sitemap lastmod comes from each page's last commit

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run Fizzy torture test
        env:
          ARCHSPEC_TORTURE: "1"
        run: bundle exec ruby -Itest test/torture_test.rb -n test_fizzy

  torture_apps:
    name: Torture against Discourse and Mastodon
    # Discourse and Mastodon are large checkouts, so only run them at release
    # (push to the default branch) and on manual or scheduled runs.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_DISABLE_SHARED_GEMS: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # sitemap lastmod comes from each page's last commit

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run Discourse and Mastodon torture tests
        env:
          ARCHSPEC_TORTURE: "1"
        run: bundle exec ruby -Itest test/torture_test.rb -n "/test_(discourse|mastodon)/"

  docs_check:
    name: Docs build
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_DISABLE_SHARED_GEMS: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          # Every release tag is built (the latest at /), and sitemap lastmod
          # comes from each page's last commit.
          fetch-depth: 0

      - name: Set up Ruby for API docs (root Gemfile)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Set up Ruby for Jekyll build (docs Gemfile)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: docs

      # Builds the latest release and this checkout, with the API docs and
      # the SEO audit as build hooks (docs/_config.yml). docs.yml deploys.
      - name: Build docs
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll-vitepress build --destination _site

  release:
    name: Release gem
    needs: [test, test_musl, docs_check, torture, torture_apps]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    secrets: inherit

  # The release job tags with GITHUB_TOKEN, which starts no other workflow,
  # so publish the new stable docs from here.
  docs:
    name: Publish docs
    needs: [release]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
